name: my-safe-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mysafe
      POSTGRES_USER: mysafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysafe -d mysafe"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["postgres"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mysafe
      MYSQL_USER: mysafe
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles: ["mysql"]

volumes:
  postgres-data:
  mysql-data:
